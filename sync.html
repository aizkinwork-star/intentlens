<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1118">
  <title>IntentLens · Send a photo to the PC</title>
  <style>
    :root { color-scheme: dark; --bg:#0b1118; --card:#121b25; --line:#25313d; --text:#e7eef6; --muted:#93a4b6; --ok:#3ddc97; --warn:#ffb454; --err:#ff6b6b; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; background:var(--bg); color:var(--text); font:16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; padding:20px; }
    main { max-width: 560px; margin: 0 auto; }
    h1 { font-size:1.25rem; margin:0 0 4px; }
    p.lede { color:var(--muted); margin:0 0 18px; font-size:.9rem; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; margin-bottom:14px; }
    label { display:block; font-size:.8rem; color:var(--muted); margin-bottom:6px; }
    input[type=text], input[type=tel] { width:100%; padding:12px; font-size:1.4rem; letter-spacing:.35em; text-align:center; border-radius:10px; border:1px solid var(--line); background:#0a121a; color:var(--text); }
    input[type=file] { width:100%; padding:12px; border-radius:10px; border:1px dashed var(--line); background:#0a121a; color:var(--text); }
    button { width:100%; padding:13px; margin-top:10px; border:0; border-radius:10px; background:#2f7cf6; color:#fff; font-size:1rem; font-weight:600; }
    button:disabled { opacity:.5; }
    button.ghost { background:transparent; border:1px solid var(--line); color:var(--text); }
    ul { list-style:none; padding:0; margin:0; }
    li { display:flex; gap:10px; align-items:center; padding:10px 0; border-bottom:1px solid var(--line); font-size:.88rem; }
    li:last-child { border-bottom:0; }
    li img { width:54px; height:54px; object-fit:cover; border-radius:8px; background:#0a121a; }
    .status { margin-top:10px; font-size:.9rem; color:var(--muted); white-space:pre-wrap; }
    .status.ok { color:var(--ok); } .status.warn { color:var(--warn); } .status.err { color:var(--err); }
    .hint { color:var(--muted); font-size:.8rem; margin-top:10px; }
    code { background:#0a121a; padding:2px 6px; border-radius:5px; }
  </style>
</head>
<body>
<main>
  <h1>Send a photo to the PC</h1>
  <p class="lede">This page is served by the IntentLens desktop app on your local network. Nothing is uploaded to the internet.</p>

  <div class="card">
    <label for="code">Upload code shown on the PC</label>
    <input id="code" type="tel" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="000000">
    <p class="hint">The code expires after 10 minutes. Create a new one on the PC if it stops working.</p>
  </div>

  <div class="card">
    <label for="files">Photo from this phone</label>
    <input id="files" type="file" accept="image/*" multiple>
    <button id="send" type="button" disabled>Send to PC</button>
    <div id="status" class="status" role="status" aria-live="polite"></div>
  </div>

  <div class="card">
    <label>Sent in this visit</label>
    <ul id="sentList"><li style="color:var(--muted)">Nothing yet.</li></ul>
  </div>

  <div class="card">
    <label for="note">Optional note for the PC</label>
    <input id="note" type="text" maxlength="200" placeholder="e.g. back of the board near the USB port" style="font-size:1rem;letter-spacing:normal;text-align:left;">
    <button id="sendNote" type="button" class="ghost">Send note</button>
  </div>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const codeInput = $('code');
  const filesInput = $('files');
  const sendBtn = $('send');
  const noteInput = $('note');
  const noteBtn = $('sendNote');
  const statusEl = $('status');
  const sentList = $('sentList');

  if (params.get('code')) codeInput.value = String(params.get('code')).replace(/\D/g, '').slice(0, 6);

  function setStatus(text, tone = '') {
    statusEl.textContent = text;
    statusEl.className = 'status' + (tone ? ' ' + tone : '');
  }
  function validCode() {
    return /^\d{6}$/.test(codeInput.value.trim());
  }
  codeInput.addEventListener('input', () => {
    codeInput.value = codeInput.value.replace(/\D/g, '').slice(0, 6);
    sendBtn.disabled = !validCode() || !filesInput.files?.length;
  });
  filesInput.addEventListener('change', () => {
    sendBtn.disabled = !validCode() || !filesInput.files?.length;
  });

  function addSent(name, note) {
    if (sentList.dataset.empty !== 'no') { sentList.replaceChildren(); sentList.dataset.empty = 'no'; }
    const li = document.createElement('li');
    const span = document.createElement('div');
    const strong = document.createElement('div');
    strong.textContent = name;
    const sub = document.createElement('div');
    sub.style.color = 'var(--muted)';
    sub.style.fontSize = '.76rem';
    sub.textContent = note;
    span.append(strong, sub);
    li.append(span);
    sentList.prepend(li);
  }

  async function shrink(file) {
    const bitmap = await createImageBitmap(file);
    const max = 2000;
    const scale = Math.min(1, max / Math.max(bitmap.width, bitmap.height));
    const width = Math.max(1, Math.round(bitmap.width * scale));
    const height = Math.max(1, Math.round(bitmap.height * scale));
    const canvas = document.createElement('canvas');
    canvas.width = width;
    canvas.height = height;
    canvas.getContext('2d').drawImage(bitmap, 0, 0, width, height);
    bitmap.close?.();
    let quality = 0.86;
    let dataUrl = canvas.toDataURL('image/jpeg', quality);
    while (dataUrl.length > 7 * 1024 * 1024 && quality > 0.4) {
      quality -= 0.12;
      dataUrl = canvas.toDataURL('image/jpeg', quality);
    }
    return { dataUrl, width, height };
  }

  async function post(body) {
    const res = await fetch('/api/sync/receive', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data?.error?.message || 'Upload failed (HTTP ' + res.status + ').');
    return data.item;
  }

  sendBtn.addEventListener('click', async () => {
    if (!validCode()) { setStatus('Enter the 6-digit code from the PC.', 'warn'); return; }
    const files = [...(filesInput.files || [])];
    if (!files.length) { setStatus('Choose at least one photo.', 'warn'); return; }
    sendBtn.disabled = true;
    let ok = 0;
    for (const file of files) {
      try {
        setStatus('Preparing ' + file.name + '…', '');
        const { dataUrl } = await shrink(file);
        setStatus('Sending ' + file.name + '…', '');
        const item = await post({ code: codeInput.value.trim(), type: 'photo', name: file.name, payload: dataUrl });
        ok += 1;
        addSent(item.name, (item.bytes / 1024).toFixed(0) + ' KB · received by the PC');
      } catch (error) {
        setStatus(String(error?.message || error), 'err');
      }
    }
    filesInput.value = '';
    sendBtn.disabled = !validCode();
    if (ok) setStatus(ok + ' photo' + (ok === 1 ? '' : 's') + ' received. Check the PC menu.', 'ok');
  });

  noteBtn.addEventListener('click', async () => {
    if (!validCode()) { setStatus('Enter the 6-digit code from the PC.', 'warn'); return; }
    const value = noteInput.value.trim();
    if (!value) { setStatus('Type a note first.', 'warn'); return; }
    noteBtn.disabled = true;
    try {
      const item = await post({ code: codeInput.value.trim(), type: 'note', name: 'note from phone', payload: value });
      noteInput.value = '';
      addSent(item.name, 'note received by the PC');
      setStatus('Note received.', 'ok');
    } catch (error) {
      setStatus(String(error?.message || error), 'err');
    } finally {
      noteBtn.disabled = false;
    }
  });
</script>
</body>
</html>
